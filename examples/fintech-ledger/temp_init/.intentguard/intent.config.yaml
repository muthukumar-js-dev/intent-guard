version: "1.0.0"

architecture:
  layers:
    - name: presentation
      path: src/presentation/**
      canImportFrom: [domain, infrastructure]
    
    - name: domain
      path: src/domain/**
      canImportFrom: []
    
    - name: infrastructure
      path: src/infrastructure/**
      canImportFrom: [domain]

# Optional: Define protected regions
protectedRegions: []

# Optional: Define banned dependencies
bannedDependencies: []
